<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Маникюр Арзамас — маникюр и дизайн ногтей</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#fdf6f4;--card:#fff;--tx:#2b1b22;--mut:#8b7078;--ac:#c9386d;--ac2:#f7d6e0;--g1:#ffe3ea;--g2:#fff1e6;--bd:#f1dce3;--sh:0 10px 30px rgba(201,56,109,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171014;--card:#231820;--tx:#f8ebf0;--mut:#bc9ea8;--ac:#f0709f;--ac2:#4a2735;--g1:#3a1d2a;--g2:#2a1a1d;--bd:#3a2832;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171014;--card:#231820;--tx:#f8ebf0;--mut:#bc9ea8;--ac:#f0709f;--ac2:#4a2735;--g1:#3a1d2a;--g2:#2a1a1d;--bd:#3a2832;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.hero{background:radial-gradient(circle at 15% 20%,var(--g1),transparent 55%),radial-gradient(circle at 90% 80%,var(--g2),transparent 55%);border-radius:0 0 48px 48px;padding-bottom:64px}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;gap:12px}
nav b{font:700 1.3rem "Cormorant Garamond",Georgia,serif;color:var(--ac)}
nav div{display:flex;gap:18px;align-items:center;font-size:.95rem}
nav a{color:var(--tx);text-decoration:none}
.hc{text-align:center;padding:48px 0 0}
.tag{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 16px;font-size:.85rem;color:var(--ac);margin-bottom:18px}
h1{font:700 clamp(2.6rem,10vw,4.8rem)/1 "Cormorant Garamond",Georgia,serif;margin:0 0 18px}
h1 span{color:var(--ac);font-style:italic}
.hc p{color:var(--mut);max-width:520px;margin:0 auto 28px;font-size:1.1rem}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:14px 32px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:var(--sh);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:var(--ac2);color:var(--tx);box-shadow:none}
.btn.sm{padding:8px 18px;font-size:.9rem}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:-34px}
.perk{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.perk i{font-style:normal;font-size:1.6rem}.perk b{display:block;margin:6px 0 2px}.perk span{color:var(--mut);font-size:.9rem}
section{padding:56px 0 8px}
h2{font:700 clamp(2rem,6vw,2.8rem)/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 6px;text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:10px 26px;box-shadow:var(--sh)}
.row{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px dashed var(--bd)}
.row:last-child{border:0}
.row .n{flex:1;font-weight:700}.row .d{color:var(--mut);font-size:.88rem;font-weight:400}
.row .p{font:700 1.35rem "Cormorant Garamond",Georgia,serif;color:var(--ac);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.work{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.work img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;cursor:zoom-in;transition:transform .4s}
.work:hover img{transform:scale(1.04)}
.work .im{overflow:hidden}
.work .c{padding:10px 14px;font-size:.9rem;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:28px}
.cta{margin-top:56px;background:linear-gradient(135deg,var(--ac),#e98ab0);color:#fff;border-radius:32px;padding:44px 24px;text-align:center}
.cta h2{color:#fff}.cta p{margin:0 0 22px;opacity:.92}
.cta .btn{background:#fff;color:#c9386d}
.contacts{text-align:center;line-height:2.1;font-size:1.05rem}
.contacts a{color:var(--ac);text-decoration:none;font-weight:700}
footer{text-align:center;padding:40px 0;color:var(--mut);font-size:.85rem}
footer a{color:var(--mut);cursor:pointer;text-decoration:underline}
input,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
input.w{width:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ac2);padding:10px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.edit{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;display:grid;gap:8px}
.x{background:none;border:0;color:#d33;cursor:pointer;font-size:1rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .box{background:var(--card);border-radius:20px;padding:24px;max-width:320px;width:100%;display:grid;gap:12px}
.modal img{max-width:95vw;max-height:90vh;border-radius:14px}
.err{color:#d33;font-size:.9rem;margin:0}
.msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60}
.scene{position:relative;height:250px;max-width:460px;margin:0 auto 26px;perspective:900px;translate:0 calc(var(--sy,0)*-.1px)}
.rig{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(calc(var(--mx,0)*16deg)) rotateX(calc(var(--my,0)*-10deg));transition:transform .15s linear}
.nails{display:flex;gap:10px;justify-content:center;align-items:flex-end;height:100%;padding-bottom:20px;transform-style:preserve-3d}
.nl{transform:translateY(var(--y)) rotate(var(--r));transform-style:preserve-3d;animation:fl 4s ease-in-out infinite var(--d)}
.n3{position:relative;width:56px;height:98px;border-radius:30px 30px 14px 14px/46px 46px 14px 14px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset -7px -12px 16px rgba(0,0,0,.2),inset 6px 6px 12px rgba(255,255,255,.5),0 22px 26px rgba(201,56,109,.3);animation:sw 6s ease-in-out infinite var(--d);transform-style:preserve-3d}
.n3::before{content:"";position:absolute;left:13%;top:8%;width:28%;height:52%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));transform:rotate(8deg)}
.n3::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);background-size:250% 100%;animation:shine 4.5s ease-in-out infinite var(--d)}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff,var(--oc) 45%,transparent 72%);animation:fl 5s ease-in-out infinite}
.o1{left:2%;top:10%;width:74px;height:74px;--oc:#ff9fc0;transform:translateZ(80px)}
.o2{right:3%;bottom:14%;width:54px;height:54px;--oc:#b79cff;transform:translateZ(-40px);animation-delay:-2s}
.sp{position:absolute;font-style:normal;color:var(--ac);animation:tw 2.4s ease-in-out infinite;transform:translateZ(50px)}
.s1{left:18%;top:4%}.s2{right:16%;top:12%;animation-delay:.8s}.s3{left:30%;bottom:2%;animation-delay:1.4s}.s4{right:30%;bottom:0;animation-delay:.4s}
@keyframes fl{50%{translate:0 -14px}}
@keyframes sw{0%,100%{transform:rotateY(-30deg) rotateX(8deg)}50%{transform:rotateY(30deg) rotateX(-6deg)}}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
@keyframes tw{0%,100%{opacity:.15;scale:.6}50%{opacity:1;scale:1.3}}
@keyframes gl{to{background-position:200% center}}
@keyframes gl2{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
h1 span{background:linear-gradient(90deg,var(--ac),#ff9fc0,#b79cff,var(--ac));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gl 5s linear infinite}
h2::after{content:"";display:block;width:13px;height:13px;margin:16px auto 0;border-radius:0 50% 50% 50%;background:var(--ac);transform:rotate(45deg)}
.cta{background-size:200% 200%;animation:gl2 8s ease infinite}
.rv{opacity:0;transform:translateY(46px) rotateX(14deg) scale(.96);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.tilt{transform-style:preserve-3d;will-change:transform}
.tilt.on{transition:transform .08s linear}
.row{transition:padding .25s}.row:hover{padding-left:10px}
@media(max-width:560px){nav div a:not(.btn){display:none}.scene{transform:scale(.85)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style></head>
<body><div id="app"></div>
<script id="data" type="application/json">{"name":"Маникюр Арзамас","tagline":"Аккуратный маникюр и стильный дизайн ногтей в Арзамасе. Стерильные инструменты, стойкое покрытие и уютная атмосфера.","phone":"","vk":"https://vk.ru/milenanailsarzamas","address":"г. Арзамас","prices":[{"n":"Классический маникюр","d":"Обработка кутикулы, придание формы","p":"1 500 ₽"},{"n":"Маникюр + гель-лак","d":"Покрытие на выбор","p":"2 500 ₽"},{"n":"Наращивание","d":"Гель, любая длина","p":"3 800 ₽"},{"n":"Дизайн (1 ноготь)","d":"Рисунок, стразы, фольга","p":"от 150 ₽"}],"works":[]}</script>
<script id="js">
let S=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app');
let admin=false;
try{admin=sessionStorage.getItem('adm')==='1'}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const m=document.createElement('div');m.className='msg';m.textContent=t;document.body.appendChild(m);setTimeout(()=>m.remove(),2600)}
function render(){
  const vk=esc(S.vk),book=`<a class="btn" href="${vk}" target="_blank" rel="noopener">Записаться ВКонтакте</a>`;
  const pr=S.prices.map((x,i)=>admin?
   `<div class="edit"><input class="w" data-k="prices.${i}.n" value="${esc(x.n)}" placeholder="Услуга"><input class="w" data-k="prices.${i}.d" value="${esc(x.d)}" placeholder="Описание"><div style="display:flex;gap:8px"><input class="w" data-k="prices.${i}.p" value="${esc(x.p)}" placeholder="Цена"><button class="x" data-act="delp" data-i="${i}" title="Удалить">✕</button></div></div>`:
   `<div class="row"><div class="n">${esc(x.n)}<div class="d">${esc(x.d)}</div></div><div class="p">${esc(x.p)}</div></div>`).join('');
  const wk=S.works.map((w,i)=>`<div class="work tilt rv"><div class="im"><img src="${w.src}" alt="${esc(w.c||'Работа мастера, Арзамас')}" data-act="zoom" data-i="${i}"></div>${admin?`<div class="c"><input class="w" data-k="works.${i}.c" value="${esc(w.c)}" placeholder="Подпись"><button class="x" data-act="delw" data-i="${i}">✕ удалить</button></div>`:(w.c?`<div class="c">${esc(w.c)}</div>`:'')}</div>`).join('');
  const ct=admin?`<div class="edit"><input class="w" data-k="name" value="${esc(S.name)}" placeholder="Название"><textarea class="w" data-k="tagline" rows="3" placeholder="Описание">${esc(S.tagline)}</textarea><input class="w" data-k="vk" value="${esc(S.vk)}" placeholder="Ссылка ВК для записи"><input class="w" data-k="phone" value="${esc(S.phone)}" placeholder="Телефон (необязательно)"><input class="w" data-k="address" value="${esc(S.address)}" placeholder="Адрес"></div>`:
   `<div class="card contacts tilt rv"><div>📍 ${esc(S.address)}</div>${S.phone?`<div>📞 <a href="tel:${esc(String(S.phone).replace(/[^\d+]/g,''))}">${esc(S.phone)}</a></div>`:''}<div>💬 <a href="${vk}" target="_blank" rel="noopener">Мы ВКонтакте</a></div></div>`;
  app.innerHTML=(admin?`<div class="bar"><b>Режим мастера</b><button class="btn sm" data-act="save">💾 Сохранить на сайт</button><button class="btn sm sec" data-act="logout">Выйти</button></div>`:'')+
  `<div class="hero"><div class="wrap"><nav><b>${esc(S.name)}</b><div><a href="#prices">Прайс</a><a href="#works">Работы</a><a href="#contacts">Контакты</a><a class="btn sm" href="${vk}" target="_blank" rel="noopener">Записаться</a></div></nav>
  <div class="hc"><div class="scene"><div class="rig"><div class="orb o1"></div><div class="orb o2"></div><div class="nails">${[['-22','26','#ff8fb5','#c9386d'],['-11','6','#f8cdbf','#e39a89'],['0','-8','#c3adff','#7b5ce6'],['11','6','#ff6a80','#b3123b'],['22','26','#ffd6e8','#f08fbd']].map((n,i)=>`<div class="nl" style="--r:${n[0]}deg;--y:${n[1]}px;--c1:${n[2]};--c2:${n[3]};--d:${i*.35}s"><div class="n3"></div></div>`).join('')}</div><i class="sp s1">✦</i><i class="sp s2">✦</i><i class="sp s3">✧</i><i class="sp s4">✦</i></div></div><span class="tag">✨ Арзамас</span><h1>Маникюр <span>Арзамас</span></h1><p>${esc(S.tagline)}</p>${book}</div></div></div>
  <div class="wrap"><div class="perks"><div class="perk tilt rv"><i>🧼</i><b>Стерильность</b><span>Обработка инструментов после каждого клиента</span></div><div class="perk tilt rv"><i>💎</i><b>Стойкое покрытие</b><span>Держится без сколов до 4 недель</span></div><div class="perk tilt rv"><i>🌸</i><b>Дизайн на любой вкус</b><span>От нежных оттенков до сложных рисунков</span></div></div>
  <section id="prices"><h2>Прайс</h2><p class="sub">Цены на услуги</p>${admin?pr+`<button class="btn sec sm" data-act="addp">+ Добавить услугу</button>`:`<div class="card rv">${pr||'<div class="empty">Скоро здесь появятся цены</div>'}</div>`}</section>
  <section id="works"><h2>Мои работы</h2><p class="sub">Примеры маникюра</p>${admin?`<div style="text-align:center;margin-bottom:16px"><label class="btn sec sm">+ Добавить фото<input id="file" type="file" accept="image/*" multiple hidden></label></div>`:''}${wk?`<div class="grid">${wk}</div>`:'<div class="empty">Скоро здесь появятся работы</div>'}</section>
  <div class="cta rv"><h2>Запишитесь на маникюр</h2><p>Выберите удобное время в личных сообщениях ВКонтакте</p>${book}</div>
  <section id="contacts"><h2>Контакты</h2><p class="sub">Мы находимся в Арзамасе</p>${ct}</section>
  <footer>© ${esc(S.name)} ${admin?'':'· <a data-act="login">Вход для мастера</a>'}</footer></div>`;fx();
}
app.addEventListener('input',e=>{
  const k=e.target.dataset.k;if(!k)return;
  const p=k.split('.');let o=S;while(p.length>1)o=o[p.shift()];o[p[0]]=e.target.value;
});
app.addEventListener('change',async e=>{
  if(e.target.id!=='file')return;
  for(const f of e.target.files){try{S.works.unshift({src:await shrink(f),c:''})}catch(x){toast('Не удалось загрузить фото')}}
  render();
});
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const m=900,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};
  im.onerror=no;im.src=u})}
app.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,i=+t.dataset.i;
  if(a==='login')return loginBox();
  if(a==='logout'){admin=false;try{sessionStorage.removeItem('adm')}catch(x){};render()}
  if(a==='addp'){S.prices.push({n:'',d:'',p:''});render()}
  if(a==='delp'){S.prices.splice(i,1);render()}
  if(a==='delw'){S.works.splice(i,1);render()}
  if(a==='zoom'&&!admin){const m=document.createElement('div');m.className='modal';m.innerHTML=`<img src="${S.works[i].src}" alt="">`;m.onclick=()=>m.remove();document.body.appendChild(m)}
  if(a==='save')save();
});
let io,fxInit=false;
function fx(){
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches,els=app.querySelectorAll('.rv');
  if(admin||rm||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'))}
  else{io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}
  if(fxInit||rm)return;fxInit=true;
  document.addEventListener('pointermove',e=>{
    const t=e.target.closest&&e.target.closest('.tilt:not(.rv:not(.in))');
    document.querySelectorAll('.tilt.on').forEach(x=>{if(x!==t){x.classList.remove('on');x.style.transform=''}});
    if(t&&!admin){const r=t.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;t.classList.add('on');t.style.transform=`perspective(800px) rotateY(${px*14}deg) rotateX(${-py*14}deg) translateZ(10px)`}
    const h=document.querySelector('.hero');if(h){h.style.setProperty('--mx',((e.clientX/innerWidth-.5)*2).toFixed(2));h.style.setProperty('--my',((e.clientY/innerHeight-.5)*2).toFixed(2))}
  });
  addEventListener('scroll',()=>document.documentElement.style.setProperty('--sy',scrollY),{passive:true});
}
function loginBox(){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><b>Вход для мастера</b><input id="pw" type="password" placeholder="Пароль" autocomplete="off"><p class="err" id="er"></p><button class="btn" id="go">Войти</button><button class="btn sec" id="cx">Отмена</button></div>`;
  document.body.appendChild(m);const pw=m.querySelector('#pw');pw.focus();
  const go=()=>{if(pw.value==='admin123'){admin=true;try{sessionStorage.setItem('adm','1')}catch(x){};m.remove();render()}else m.querySelector('#er').textContent='Неверный пароль'};
  m.querySelector('#go').onclick=go;m.querySelector('#cx').onclick=()=>m.remove();pw.onkeydown=e=>{if(e.key==='Enter')go()};
}
function buildDoc(){
  const css=document.getElementById('css').textContent,js=document.getElementById('js').textContent;
  const data=JSON.stringify(S).replace(/</g,'\\u003c');
  const head=document.head.querySelector('link[href*="fonts.googleapis.com/css2"]').outerHTML;
  return '<!DOCTYPE html>\n<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(S.name)+' — маникюр и дизайн ногтей</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+head+'<style id="css">'+css+'</style></head><body><div id="app"></div><script id="data" type="application/json">'+data+'<\/script><script id="js">'+js+'<\/script></body></html>';
}
async function save(){
  let art=null;try{art=await claude.use('artifact')}catch(e){}
  if(!art){toast('Сохранение доступно только владельцу страницы в Claude');return}
  try{await art.publish(buildDoc());toast('Сохранено')}catch(e){toast(e&&e.code==='conflict'?'Страница уже обновлена':'Не удалось сохранить')}
}
render();
</script></body></html>
